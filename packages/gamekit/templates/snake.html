<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake</title>
<script type="application/json" id="pl-manifest">
{"title":"Snake","description":"Swipe to steer the growing snake. Eat the food, avoid the walls and your own tail.","controls":"swipe","orientation":"portrait","sdkVersion":1,"tags":["arcade","classic","snake"],"scoring":"higher"}
</script>
<style>
html,body{margin:0;height:100%;background:#0d1b2a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
if (!window.PlayLoop) window.PlayLoop = { ready() {}, gameOver() {}, haptic() {}, safeArea: { top: 0, bottom: 0 } };
const cv = document.getElementById('c'); const ctx = cv.getContext('2d');
const COLS = 16, ROWS = 22;
let W = 0, H = 0, last = 0, over = false, ready = false, score = 0, acc = 0, stepTime = 0.14;
let snake = [], dir = { x: 1, y: 0 }, nextDir = { x: 1, y: 0 }, food = { x: 5, y: 5 }, swipeX = 0, swipeY = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function placeFood() {
  let ok = false;
  while (!ok) { food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) }; ok = !snake.some((s) => s.x === food.x && s.y === food.y); }
}
function turn(x, y) { if (x === -dir.x && y === -dir.y) return; nextDir = { x: x, y: y }; }
window.addEventListener('resize', resize); resize();
snake = [{ x: 6, y: 11 }, { x: 5, y: 11 }, { x: 4, y: 11 }]; placeFood();
window.addEventListener('pointerdown', (e) => { swipeX = e.clientX; swipeY = e.clientY; });
window.addEventListener('pointerup', (e) => { const dx = e.clientX - swipeX, dy = e.clientY - swipeY; if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1); });
window.addEventListener('keydown', (e) => {
  if (e.code === 'ArrowLeft') turn(-1, 0); if (e.code === 'ArrowRight') turn(1, 0);
  if (e.code === 'ArrowUp') turn(0, -1); if (e.code === 'ArrowDown') turn(0, 1);
});
function end() { over = true; PlayLoop.gameOver({ score: score }); }
function update(dt) {
  acc += dt;
  if (acc < stepTime) return;
  acc = 0; dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  const hitWall = head.x < 0 || head.y < 0 || head.x >= COLS || head.y >= ROWS;
  if (hitWall || snake.some((s) => s.x === head.x && s.y === head.y)) { end(); return; }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10; stepTime = Math.max(0.075, stepTime * 0.97); PlayLoop.haptic('light'); placeFood();
  } else snake.pop();
}
function draw() {
  const sa = PlayLoop.safeArea || { top: 0, bottom: 0 };
  const cell = Math.min(W / COLS, (H - sa.top - sa.bottom - 40) / ROWS);
  const ox = (W - cell * COLS) / 2, oy = sa.top + (H - sa.top - sa.bottom - cell * ROWS) / 2;
  ctx.fillStyle = '#0d1b2a'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e63946'; ctx.fillRect(ox + food.x * cell + 2, oy + food.y * cell + 2, cell - 4, cell - 4);
  ctx.fillStyle = '#4cc9f0';
  for (const s of snake) ctx.fillRect(ox + s.x * cell + 1, oy + s.y * cell + 1, cell - 2, cell - 2);
  ctx.fillStyle = '#e9f0ff'; ctx.font = '600 20px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.fillText('Score ' + score, 14, sa.top + 30);
  ctx.textAlign = 'center'; ctx.fillText('SWIPE OR ARROWS TO STEER', W / 2, H - sa.bottom - 20);
}
function frame(t) {
  const dt = Math.min((t - last) / 1000, 0.05); last = t; if (!over) update(dt); draw();
  if (!ready) { ready = true; PlayLoop.ready(); } if (!over) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

setInterval(function () { try { PlayLoop.submitScore(Math.floor(score)); } catch (e) {} }, 500);
</script>
</body>
</html>
