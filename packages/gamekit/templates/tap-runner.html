<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tap Runner</title>
<script type="application/json" id="pl-manifest">
{"title":"Tap Runner","description":"Tap to jump over the scrolling obstacles and run as far as you can.","controls":"tap","orientation":"portrait","sdkVersion":1,"tags":["arcade","runner","endless"],"scoring":"higher"}
</script>
<style>
html,body{margin:0;height:100%;background:#101a33;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
if (!window.PlayLoop) window.PlayLoop = { ready() {}, gameOver() {}, haptic() {}, safeArea: { top: 0, bottom: 0 } };
const cv = document.getElementById('c'); const ctx = cv.getContext('2d');
let W = 0, H = 0, last = 0, over = false, ready = false, score = 0, speed = 300, spawnT = 0.4;
const player = { x: 0, y: 0, vy: 0, s: 36, grounded: true };
const obstacles = [];
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize); resize();
function jump() { if (!over && player.grounded) { player.vy = -780; player.grounded = false; PlayLoop.haptic('light'); } }
window.addEventListener('pointerdown', jump);
window.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'ArrowUp') jump(); });
function end() { over = true; PlayLoop.gameOver({ score: Math.floor(score) }); }
function update(dt) {
  const sa = PlayLoop.safeArea || { top: 0, bottom: 0 };
  const groundY = H - 110 - sa.bottom;
  score += speed * dt * 0.02; speed += 7 * dt; player.x = W * 0.25;
  player.vy += 2100 * dt; player.y += player.vy * dt;
  if (player.y >= groundY - player.s) { player.y = groundY - player.s; player.vy = 0; player.grounded = true; }
  spawnT -= dt;
  if (spawnT <= 0) {
    obstacles.push({ x: W + 30, w: 22 + Math.random() * 26, h: 34 + Math.random() * 52 });
    spawnT = (0.9 + Math.random() * 0.7) * (300 / speed) + 0.3;
  }
  for (const o of obstacles) o.x -= speed * dt;
  while (obstacles.length > 0 && obstacles[0].x + obstacles[0].w < -20) obstacles.shift();
  for (const o of obstacles) if (player.x + player.s > o.x && player.x < o.x + o.w && player.y + player.s > groundY - o.h) end();
}
function draw() {
  const sa = PlayLoop.safeArea || { top: 0, bottom: 0 };
  const groundY = H - 110 - sa.bottom;
  ctx.fillStyle = '#101a33'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#1d2b52'; ctx.fillRect(0, groundY, W, H - groundY);
  ctx.fillStyle = '#e8563f';
  for (const o of obstacles) ctx.fillRect(o.x, groundY - o.h, o.w, o.h);
  ctx.fillStyle = '#ffd166'; ctx.fillRect(player.x, player.y, player.s, player.s);
  ctx.fillStyle = '#e9f0ff'; ctx.font = '600 20px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.fillText('Score ' + Math.floor(score), 14, sa.top + 30);
  ctx.textAlign = 'center'; ctx.fillText('TAP / SPACE TO JUMP', W / 2, H - sa.bottom - 24);
}
function frame(t) {
  const dt = Math.min((t - last) / 1000, 0.05); last = t; if (!over) update(dt); draw();
  if (!ready) { ready = true; PlayLoop.ready(); } if (!over) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

setInterval(function () { try { PlayLoop.submitScore(Math.floor(score)); } catch (e) {} }, 500);
</script>
</body>
</html>
