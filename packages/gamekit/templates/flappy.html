<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flappy</title>
<script type="application/json" id="pl-manifest">
{"title":"Flappy","description":"Tap to flap the bird through the gaps between pipes. Score one point per pipe.","controls":"tap","orientation":"portrait","sdkVersion":1,"tags":["arcade","flappy","endless"],"scoring":"higher"}
</script>
<style>
html,body{margin:0;height:100%;background:#0e2137;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
if (!window.PlayLoop) window.PlayLoop = { ready() {}, gameOver() {}, haptic() {}, safeArea: { top: 0, bottom: 0 } };
const cv = document.getElementById('c'); const ctx = cv.getContext('2d');
let W = 0, H = 0, last = 0, over = false, ready = false, started = false, score = 0, speed = 235, spawnT = 0.6;
const bird = { x: 0, y: 0, vy: 0, r: 15 };
const pipes = [];
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  if (!bird.y) { bird.y = H * 0.4; }
  cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize); resize();
// Physics waits for the first tap: with the real chrome insets the bird used
// to fall into the ground during the opening second, so the game was over
// before the player had touched it.
function flap() {
  if (over) { restart(); return; }
  started = true; bird.vy = -430; PlayLoop.haptic('light');
}
window.addEventListener('pointerdown', flap);
window.addEventListener('keydown', (e) => { if (e.code === 'Space' || e.code === 'ArrowUp') flap(); });
function end() { over = true; bird.vy = 0; PlayLoop.gameOver({ score: score }); }
function restart() {
  over = false; started = false; score = 0; speed = 235; spawnT = 0.6;
  pipes.length = 0; bird.y = H * 0.4; bird.vy = 0; last = 0;
  requestAnimationFrame(frame);
}
function update(dt) {
  if (!started) return;
  const sa = PlayLoop.safeArea || { top: 0, bottom: 0 };
  const ceiling = sa.top + 8;
  const groundY = H - 64 - sa.bottom;
  bird.x = W * 0.3; bird.vy += 1450 * dt; bird.y += bird.vy * dt;
  spawnT -= dt;
  if (spawnT <= 0) {
    const gap = Math.min(230, Math.max(150, (groundY - ceiling) * 0.36));
    const span = Math.max(40, groundY - ceiling - gap - 30);
    pipes.push({ x: W + 40, gapY: ceiling + 12 + Math.random() * span, gap: gap, w: 62, hit: false });
    spawnT = 1.5 * (235 / speed);
  }
  speed += 1.2 * dt;
  for (const p of pipes) {
    p.x -= speed * dt;
    if (!p.hit && p.x + p.w < bird.x) { p.hit = true; score += 1; PlayLoop.haptic('medium'); }
    const inX = bird.x + bird.r > p.x && bird.x - bird.r < p.x + p.w; const inGap = bird.y - bird.r > p.gapY && bird.y + bird.r < p.gapY + p.gap;
    if (inX && !inGap) end();
  }
  while (pipes.length > 0 && pipes[0].x + pipes[0].w < -30) pipes.shift();
  // The ceiling is the app's chrome, not the canvas: a bird that can reach
  // y=0 spends part of every run hidden behind the profile row.
  if (bird.y - bird.r < ceiling) { bird.y = ceiling + bird.r; bird.vy = 0; }
  if (bird.y + bird.r > groundY) end();
}
function draw() {
  const sa = PlayLoop.safeArea || { top: 0, bottom: 0 };
  const ceiling = sa.top + 8;
  const groundY = H - 64 - sa.bottom;
  ctx.fillStyle = '#0e2137'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#28604a';
  for (const p of pipes) {
    ctx.fillRect(p.x, ceiling, p.w, Math.max(0, p.gapY - ceiling));
    ctx.fillRect(p.x, p.gapY + p.gap, p.w, Math.max(0, groundY - p.gapY - p.gap));
  }
  ctx.fillStyle = '#173f2f'; ctx.fillRect(0, groundY, W, H - groundY);
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.arc(bird.x, bird.y, bird.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e9f0ff'; ctx.font = '600 20px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.fillText('Score ' + score, 14, sa.top + 30);
  ctx.textAlign = 'center';
  if (over) {
    // Without this the frame simply stopped: the player died and the screen
    // froze with no explanation and no way back.
    ctx.fillStyle = 'rgba(6, 14, 26, 0.72)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd166'; ctx.font = '800 34px system-ui, sans-serif';
    ctx.fillText('GAME OVER', W / 2, H * 0.42);
    ctx.fillStyle = '#e9f0ff'; ctx.font = '600 22px system-ui, sans-serif';
    ctx.fillText('Score ' + score, W / 2, H * 0.48);
    ctx.fillStyle = '#7ee0c1'; ctx.font = '700 17px system-ui, sans-serif';
    ctx.fillText('TAP TO PLAY AGAIN', W / 2, H * 0.58);
  } else {
    ctx.fillStyle = '#e9f0ff'; ctx.font = '600 20px system-ui, sans-serif';
    ctx.fillText(started ? 'TAP / SPACE TO FLAP' : 'TAP TO START', W / 2, H - sa.bottom - 24);
  }
}
function frame(t) {
  const dt = last ? Math.min((t - last) / 1000, 0.05) : 0; last = t;
  if (!over) update(dt); draw();
  if (!ready) { ready = true; PlayLoop.ready(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

setInterval(function () { try { PlayLoop.submitScore(Math.floor(score)); } catch (e) {} }, 500);
</script>
</body>
</html>
