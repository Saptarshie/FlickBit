<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Physics Toss</title>
<script type="application/json" id="pl-manifest">
{"title":"Physics Toss","description":"Drag and release to toss the ball at the targets. Five shots to score as much as you can.","controls":"drag","orientation":"portrait","sdkVersion":1,"tags":["physics","skill","toss"],"scoring":"higher"}
</script>
<style>
html,body{margin:0;height:100%;background:#22223b;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
if (!window.PlayLoop) window.PlayLoop = { ready() {}, gameOver() {}, haptic() {}, safeArea: { top: 0, bottom: 0 } };
const cv = document.getElementById('c'); const ctx = cv.getContext('2d');
let W = 0, H = 0, last = 0, over = false, ready = false, score = 0, shots = 5, dragging = false, restT = 0;
const ball = { x: 0, y: 0, vx: 0, vy: 0, r: 14 }; const kb = { a: -0.9, p: 620 };
let targets = [], aim = { x: 0, y: 0 };
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function layout() {
  const sa = PlayLoop.safeArea || { top: 0, bottom: 0 };
  ball.x = 70; ball.y = H - 150 - sa.bottom; ball.vx = 0; ball.vy = 0; targets = [];
  for (let i = 0; i < 4; i += 1) targets.push({ x: 80 + Math.random() * Math.max(60, W - 160), y: sa.top + 70 + Math.random() * Math.max(60, H * 0.4), r: 22 + Math.random() * 12, val: (i + 1) * 10 });
}
function launch(vx, vy) { if (over || shots <= 0 || ball.vx !== 0 || ball.vy !== 0) return; ball.vx = vx; ball.vy = vy; shots -= 1; restT = 0; PlayLoop.haptic('medium'); }
window.addEventListener('resize', () => { resize(); layout(); }); resize(); layout();
window.addEventListener('pointerdown', (e) => { dragging = true; aim.x = e.clientX; aim.y = e.clientY; });
window.addEventListener('pointermove', (e) => { if (dragging) { aim.x = e.clientX; aim.y = e.clientY; } });
window.addEventListener('pointerup', (e) => { if (dragging) { dragging = false; launch((e.clientX - ball.x) * 3.2, (e.clientY - ball.y) * 3.2); } });
window.addEventListener('keydown', (e) => { if (e.code === 'ArrowLeft') kb.a -= 0.08; if (e.code === 'ArrowRight') kb.a += 0.08; if (e.code === 'ArrowUp') kb.p = Math.min(1100, kb.p + 40); if (e.code === 'ArrowDown') kb.p = Math.max(200, kb.p - 40); if (e.code === 'Space') launch(Math.cos(kb.a) * kb.p, Math.sin(kb.a) * kb.p); });
function update(dt) {
  const sa = PlayLoop.safeArea || { top: 0, bottom: 0 };
  const floorY = H - 40 - sa.bottom;
  ball.vy += 980 * dt; ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  if (ball.x < ball.r || ball.x > W - ball.r) { ball.x = Math.max(ball.r, Math.min(W - ball.r, ball.x)); ball.vx = (ball.x < W / 2 ? 1 : -1) * Math.abs(ball.vx) * 0.72; }
  if (ball.y < ball.r + sa.top) { ball.y = ball.r + sa.top; ball.vy = Math.abs(ball.vy) * 0.72; }
  if (ball.y > floorY - ball.r) { ball.y = floorY - ball.r; ball.vy = -Math.abs(ball.vy) * 0.72; ball.vx *= 0.92; }
  for (const t of targets) {
    const dx = ball.x - t.x, dy = ball.y - t.y;
    if (Math.sqrt(dx * dx + dy * dy) < ball.r + t.r) { score += t.val; PlayLoop.haptic('heavy'); t.x = 80 + Math.random() * Math.max(60, W - 160); t.y = sa.top + 70 + Math.random() * Math.max(60, H * 0.4); }
  }
  const speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
  if (speed < 30) {
    restT += dt; if (restT > 0.8) {
      ball.vx = 0; ball.vy = 0; ball.x = 70; ball.y = floorY - 120; restT = 0;
      if (shots <= 0) { over = true; PlayLoop.gameOver({ score: score }); }
    }
  } else restT = 0;
}
function draw() {
  const sa = PlayLoop.safeArea || { top: 0, bottom: 0 };
  const floorY = H - 40 - sa.bottom;
  ctx.fillStyle = '#22223b'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#3a3a5c'; ctx.fillRect(0, floorY, W, H - floorY);
  if (dragging) { ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(ball.x, ball.y); ctx.lineTo(aim.x, aim.y); ctx.stroke(); }
  for (const t of targets) { ctx.fillStyle = '#06d6a0'; ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#0b1320'; ctx.font = '600 16px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText(String(t.val), t.x, t.y + 5); }
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e9f0ff'; ctx.font = '600 20px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.fillText('Score ' + score + '  Shots ' + shots, 14, sa.top + 30);
  ctx.textAlign = 'center'; ctx.fillText('DRAG FROM BALL AND RELEASE', W / 2, H - sa.bottom - 22);
}
function frame(t) {
  const dt = Math.min((t - last) / 1000, 0.05); last = t; if (!over) update(dt); draw();
  if (!ready) { ready = true; PlayLoop.ready(); } if (!over) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

setInterval(function () { try { PlayLoop.submitScore(Math.floor(score)); } catch (e) {} }, 500);
</script>
</body>
</html>
