<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Brick Breaker</title>
<script type="application/json" id="pl-manifest">
{"title":"Brick Breaker","description":"Drag the paddle to bounce the ball and smash every brick. Clear the wall to win.","controls":"drag","orientation":"portrait","sdkVersion":1,"tags":["arcade","classic","bricks"],"scoring":"higher"}
</script>
<style>
html,body{margin:0;height:100%;background:#12111c;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
if (!window.PlayLoop) window.PlayLoop = { ready() {}, gameOver() {}, haptic() {}, safeArea: { top: 0, bottom: 0 } };
const cv = document.getElementById('c'); const ctx = cv.getContext('2d');
let W = 0, H = 0, last = 0, over = false, ready = false, score = 0, dragging = false;
const paddle = { x: 0, w: 110, h: 14 };
const ball = { x: 0, y: 0, vx: 260, vy: -320, r: 9 };
let bricks = [];
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function layout() {
  const sa = PlayLoop.safeArea || { top: 0, bottom: 0 };
  paddle.x = W / 2 - paddle.w / 2;
  ball.x = W / 2; ball.y = H - 150 - sa.bottom;
  bricks = [];
  const cols = 7, rows = 5, bw = (W - 40) / cols;
  for (let r = 0; r < rows; r += 1) for (let c = 0; c < cols; c += 1) bricks.push({ x: 20 + c * bw + 3, y: sa.top + 70 + r * 30, w: bw - 6, h: 22 });
}
window.addEventListener('resize', () => { resize(); layout(); }); resize(); layout();
window.addEventListener('pointerdown', (e) => { dragging = true; paddle.x = e.clientX - paddle.w / 2; });
window.addEventListener('pointermove', (e) => { if (dragging) paddle.x = e.clientX - paddle.w / 2; });
window.addEventListener('pointerup', () => { dragging = false; });
window.addEventListener('keydown', (e) => { if (e.code === 'ArrowLeft') paddle.x -= 40; if (e.code === 'ArrowRight') paddle.x += 40; });
function end(won) { if (over) return; over = true; PlayLoop.gameOver({ score: score, won: won }); }
function update(dt) {
  const sa = PlayLoop.safeArea || { top: 0, bottom: 0 };
  const paddleY = H - 80 - sa.bottom;
  paddle.x = Math.max(8, Math.min(W - paddle.w - 8, paddle.x));
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  if (ball.x < ball.r || ball.x > W - ball.r) { ball.vx = -ball.vx; ball.x = Math.max(ball.r, Math.min(W - ball.r, ball.x)); }
  if (ball.y < ball.r + sa.top) { ball.vy = -ball.vy; ball.y = ball.r + sa.top; }
  if (ball.vy > 0 && ball.y + ball.r > paddleY && ball.y - ball.r < paddleY + paddle.h && ball.x > paddle.x - ball.r && ball.x < paddle.x + paddle.w + ball.r) {
    ball.vy = -Math.abs(ball.vy) * 1.02; ball.vx += (ball.x - (paddle.x + paddle.w / 2)) * 9; ball.y = paddleY - ball.r; PlayLoop.haptic('light');
  }
  for (let i = bricks.length - 1; i >= 0; i -= 1) {
    const b = bricks[i];
    if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) { bricks.splice(i, 1); ball.vy = -ball.vy; score += 10; PlayLoop.haptic('medium'); }
  }
  if (bricks.length === 0) end(true); if (ball.y > H + 30) end(false);
}
function draw() {
  const sa = PlayLoop.safeArea || { top: 0, bottom: 0 };
  const paddleY = H - 80 - sa.bottom;
  ctx.fillStyle = '#12111c'; ctx.fillRect(0, 0, W, H);
  const colors = ['#ef476f', '#ffd166', '#06d6a0', '#118ab2', '#9b5de5'];
  for (const b of bricks) { ctx.fillStyle = colors[Math.floor(b.y / 30) % colors.length]; ctx.fillRect(b.x, b.y, b.w, b.h); }
  ctx.fillStyle = '#f5f5f5'; ctx.fillRect(paddle.x, paddleY, paddle.w, paddle.h);
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e9f0ff'; ctx.font = '600 20px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.fillText('Score ' + score, 14, sa.top + 30);
  ctx.textAlign = 'center'; ctx.fillText('DRAG OR ARROWS TO MOVE PADDLE', W / 2, H - sa.bottom - 22);
}
function frame(t) {
  const dt = Math.min((t - last) / 1000, 0.05); last = t; if (!over) update(dt); draw();
  if (!ready) { ready = true; PlayLoop.ready(); } if (!over) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
