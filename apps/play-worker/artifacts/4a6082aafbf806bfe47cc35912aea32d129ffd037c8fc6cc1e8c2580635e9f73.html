<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Memory</title>
<script type="application/json" id="pl-manifest">
{"title":"Memory","description":"Tap cards to flip them and find all eight matching pairs in as few moves as possible.","controls":"tap","orientation":"portrait","sdkVersion":1,"tags":["puzzle","memory","pairs"],"scoring":"lower"}
</script>
<style>
html,body{margin:0;height:100%;background:#141b2d;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
if (!window.PlayLoop) window.PlayLoop = { ready() {}, gameOver() {}, haptic() {}, safeArea: { top: 0, bottom: 0 } };
const cv = document.getElementById('c'); const ctx = cv.getContext('2d');
const GLYPHS = ['♦', '♥', '♣', '♠', '★', '☾', '☀', '☁'];
let W = 0, H = 0, last = 0, over = false, ready = false, moves = 0, busy = 0, cur = 0;
let cards = [], open = [];
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W * dpr); cv.height = Math.floor(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function deal() {
  const pairs = GLYPHS.concat(GLYPHS);
  for (let i = pairs.length - 1; i > 0; i -= 1) { const j = Math.floor(Math.random() * (i + 1)); const t = pairs[i]; pairs[i] = pairs[j]; pairs[j] = t; }
  cards = pairs.map((g) => ({ glyph: g, up: false, done: false })); open = []; moves = 0;
}
function gridRect() {
  const sa = PlayLoop.safeArea || { top: 0, bottom: 0 };
  const c = Math.min((W - 24) / 4, (H - sa.top - sa.bottom - 110) / 4);
  return { x: (W - c * 4) / 2, y: sa.top + (H - sa.top - sa.bottom - c * 4) / 2 + 6, c: c };
}
function flipAt(i) {
  if (over || busy > 0 || i < 0 || i >= cards.length) return;
  const card = cards[i]; if (card.up || card.done) return;
  card.up = true; cur = i; open.push(i); PlayLoop.haptic('light');
  if (open.length === 2) {
    moves += 1; const a = cards[open[0]], b = cards[open[1]];
    if (a.glyph === b.glyph) {
      a.done = true; b.done = true; open = []; PlayLoop.haptic('medium');
      if (cards.every((c) => c.done)) { over = true; PlayLoop.gameOver({ score: moves }); }
    } else busy = 0.75;
  }
}
window.addEventListener('resize', resize); resize(); deal();
window.addEventListener('pointerdown', (e) => { const g = gridRect(); const x = Math.floor((e.clientX - g.x) / g.c), y = Math.floor((e.clientY - g.y) / g.c); if (x >= 0 && y >= 0 && x < 4 && y < 4) flipAt(y * 4 + x); });
window.addEventListener('keydown', (e) => { if (e.code === 'ArrowLeft') cur = Math.max(0, cur - 1); if (e.code === 'ArrowRight') cur = Math.min(15, cur + 1); if (e.code === 'ArrowUp') cur = Math.max(0, cur - 4); if (e.code === 'ArrowDown') cur = Math.min(15, cur + 4); if (e.code === 'Space') flipAt(cur); });
function update(dt) { if (busy > 0) { busy -= dt; if (busy <= 0) { for (const i of open) cards[i].up = false; open = []; } } }
function draw() {
  const g = gridRect(); const sa = PlayLoop.safeArea || { top: 0, bottom: 0 };
  ctx.fillStyle = '#141b2d'; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < cards.length; i += 1) {
    const card = cards[i], cx = g.x + (i % 4) * g.c, cy = g.y + Math.floor(i / 4) * g.c;
    ctx.fillStyle = card.done ? '#1f6f54' : (card.up ? '#f4f1de' : '#2b3a67');
    ctx.fillRect(cx + 4, cy + 4, g.c - 8, g.c - 8);
    if (card.up || card.done) {
      ctx.fillStyle = '#141b2d'; ctx.font = Math.floor(g.c * 0.5) + 'px system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(card.glyph, cx + g.c / 2, cy + g.c / 2 + 2); ctx.textBaseline = 'alphabetic';
    }
    if (i === cur) { ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 3; ctx.strokeRect(cx + 4, cy + 4, g.c - 8, g.c - 8); }
  }
  ctx.fillStyle = '#e9f0ff'; ctx.font = '600 20px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.fillText('Moves ' + moves, 14, sa.top + 30);
  ctx.textAlign = 'center'; ctx.fillText('TAP CARDS TO FIND PAIRS', W / 2, H - sa.bottom - 20);
}
function frame(t) {
  const dt = Math.min((t - last) / 1000, 0.05); last = t; if (!over) update(dt); draw();
  if (!ready) { ready = true; PlayLoop.ready(); } if (!over) requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
