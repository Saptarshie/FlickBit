<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spike 001 — browser agent</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: #0b0b10; color: #e7e7ea; }
      header { padding: 14px 18px; border-bottom: 1px solid #23232b; display: flex; gap: 12px; align-items: baseline; }
      h1 { font-size: 14px; margin: 0; letter-spacing: .3px; }
      #status { font-size: 12px; opacity: .7; }
      main { padding: 14px 18px; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
      section h2 { font-size: 11px; letter-spacing: 1.4px; opacity: .5; margin: 0 0 8px; text-transform: uppercase; }
      #log { white-space: pre-wrap; word-break: break-word; max-height: 72vh; overflow: auto; }
      #preview { width: 100%; height: 72vh; border: 1px solid #23232b; border-radius: 8px; background: #000; }
      .ok { color: #4ade80; } .bad { color: #f87171; } .dim { opacity: .55; }
    </style>
  </head>
  <body>
    <header>
      <h1>Spike 001 — Pi Agent Core in a Worker</h1>
      <span id="status">starting…</span>
    </header>
    <main>
      <section>
        <h2>Agent log</h2>
        <div id="log"></div>
      </section>
      <section>
        <h2>What it wrote (live preview)</h2>
        <iframe id="preview" sandbox="allow-scripts" title="generated game"></iframe>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
